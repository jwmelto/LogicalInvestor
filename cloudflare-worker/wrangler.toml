name = "logicalinvestor-push"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# @block65/webcrypto-web-push (Web Push crypto) references node:crypto in an unreachable
# fallback branch. Workers always provides the globalThis.crypto it prefers instead. The bundler
# can't prove that statically, so this flag is needed to resolve the import without a warning.
compatibility_flags = ["nodejs_compat"]

# Serves the web-push registration page. It's a client of this Worker's API, not part of the
# Worker's own source, so it lives at the repo's top level (../web-push), alongside the RN app,
# instead of nested in here. Requests that don't match a file there fall through to the fetch()
# handler below. /register, /unregister, /status, and /vapid-public-key are unaffected.
[assets]
directory = "../web-push"

[triggers]
crons = [
  "0,5,10,15,20,25,30,35,40,45,50,55 * * * *",
  "1,6,11,16,21,26,31,36,41,46,51,56 * * * *",
  "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
]

[observability.logs]
enabled = true
invocation_logs = true

# Exposes the tag/id set by `deploy.sh`'s `wrangler deploy --tag "$(git rev-parse --short HEAD)"`
# to the running Worker itself, surfaced via GET /status — lets a live deploy be traced back to
# the exact git commit that produced it.
[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
POLL_INTERVAL_TRADING  = "5"    # minutes between polls during trading hours; must be multiple of 5
POLL_INTERVAL_LATEDAY  = "15"   # minutes between polls during late-day window
POLL_INTERVAL_OVERNIGHT = "60"  # minutes between polls overnight and weekends
POLL_BOUNDARY_OPEN    = "0915"  # hhmm ET: start of trading hours
POLL_BOUNDARY_LATEDAY = "1400"  # hhmm ET: start of late-day (reduced polling) window
POLL_BOUNDARY_CLOSE   = "1615"  # hhmm ET: end of late-day window / start of overnight
MAX_PUSH_AGE_MINUTES  = "120"   # content older than this won't be pushed even if newly-seen
MAX_ALERT_ITEMS_PER_FEED = "25" # cap on how many of a feed's most-recent posts are considered per poll
ACTIONABLE_AUTHORS = "Sean Hyman" # comma-separated; who can trigger the 'actionable' tier
VAPID_PUBLIC_KEY = "BGept7obnwDwF1lwsbiMLGMn4JlvNqbXlWWWGCAryLTNEc4mZBBFyEBxedhGgfAXvzWQDX1fRj6IlyshUw18u6c" # Web Push VAPID key pair; safe to commit, not secret
VAPID_SUBJECT = "mailto:jwmelto@users.sourceforge.net" # required by the Web Push protocol as a contact for push services
CORS_ALLOWED_ORIGIN = "https://logicalinvestor.net" # Origin allowed to call this API cross-origin. Currently unused: the page is Cloudflare-hosted, same-origin. See index.ts.
# FEED_TOKEN and VAPID_PRIVATE_KEY are secrets — set with: wrangler secret put FEED_TOKEN / VAPID_PRIVATE_KEY

# After running `wrangler kv namespace create TOKENS`, paste the id below
[[kv_namespaces]]
binding = "TOKENS"
id = "ee1f4e5de20d45ddb00894a8f118094c"

# After running `wrangler kv namespace create STATE`, paste the id below
[[kv_namespaces]]
binding = "STATE"
id = "837495a5d5114a5abb02a3d4cdd83dd2"

# Webpush fan-out (one message per subscriber-per-item — Web Push has no bulk-send endpoint).
# Free-plan compatible as of 2026-02-04 (10,000 ops/day). Run `wrangler queues create
# webpush-notifications` once before the first deploy that references this binding.
[[queues.producers]]
queue = "webpush-notifications"
binding = "WEBPUSH_QUEUE"

[[queues.consumers]]
queue = "webpush-notifications"
# Keeps each consumer invocation's subrequest count (1 fetch to the push service per message,
# plus an occasional KV delete for an expired subscription) under the free plan's 50/invocation
# cap. ponytail: a batch that's all-expired subscriptions could still exceed it (each pays 2
# subrequests); raise max_retries or lower max_batch_size if that shows up in practice.
max_batch_size = 45
max_retries = 3

# Per-device access revalidation, decoupled from the polling cron's own notify path (issue #86).
# runChannel only enqueues here (cheap: KV list, no fetch); this queue's consumer does the actual
# feedTokenHasAccess fetch, one per message, in its own invocation with its own subrequest budget
# — the same pattern as webpush-notifications above, applied to validation instead of sends. Run
# `wrangler queues create token-validation` once before the first deploy that references this
# binding.
[[queues.producers]]
queue = "token-validation"
binding = "VALIDATION_QUEUE"

[[queues.consumers]]
queue = "token-validation"
# Same reasoning as webpush-notifications' consumer above: 1 fetch per message, occasionally 1 KV
# put/delete, kept under the free plan's 50-subrequest-per-invocation cap.
max_batch_size = 45
max_retries = 3
